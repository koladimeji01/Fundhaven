name: BudgetWise database and API tests

on:
  push:
    branches:
      - main
      - feature/postgresql-integration
  pull_request:

jobs:
  sqlite-tests:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: testing
      DATABASE_NAME: ci_budgetwise.db
      SECRET_KEY: sqlite-test-key-for-ci-only-not-for-production-2026
      ALGORITHM: HS256
    steps:
      - uses: actions/checkout@v4
      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Run existing BudgetWise tests with SQLite
        run: python -m pytest -q

  postgres-tests:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: testing
      BUDGETWISE_TEST_POSTGRES: '1'
      DATABASE_URL: postgresql://budgetwise:budgetwise_ci_only@127.0.0.1:5432/budgetwise_test
      DATABASE_NAME: do_not_use_this_sqlite_file.db
      SECRET_KEY: postgres-test-key-for-ci-only-not-for-production-2026
      ALGORITHM: HS256
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: budgetwise
          POSTGRES_PASSWORD: budgetwise_ci_only
          POSTGRES_DB: budgetwise_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U budgetwise -d budgetwise_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Run real PostgreSQL integration and data migration tests
        run: python -m pytest tests/test_postgres_integration.py -q
