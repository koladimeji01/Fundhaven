name: FundHaven database and API tests

on:
  push:
    branches:
      - main
      - feature/postgresql-integration
      - feature/free-cloud-deployment
  pull_request:

permissions:
  contents: read

jobs:
  repository-hygiene:
    name: Prevent accidental private data/secret commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate tracked files
        run: python3 scripts/check_repository_hygiene.py

  sqlite-tests:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: testing
      DATABASE_NAME: ci_budgetwise.db
      SECRET_KEY: sqlite-test-key-for-ci-only-not-for-production-2026
      ALGORITHM: HS256
    steps:
      - uses: actions/checkout@v4
      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Run existing FundHaven tests with SQLite
        run: python -m pytest -q tests
      - name: Validate frontend JavaScript without changing icons/layout
        run: |
          node --check frontend/build.js
          for file in frontend/js/*.js; do node --check "$file"; done
      - name: Test shared topbar interactions across six pages
        run: node frontend/test-topbar.js
      - name: Guard against slow frontend startup paths
        run: node frontend/test-performance.js
      - name: Test preferred currency across FundHaven pages
        run: |
          node --check frontend/test-currency.js
          node frontend/test-currency.js
      - name: Test Finova AI dashboard interactions without a network
        run: |
          node --check frontend/test-finova.js
          node frontend/test-finova.js
      - name: Verify Netlify/Vercel build accepts FundHaven API URL
        env:
          FUNDHAVEN_API_URL: https://example.onrender.com/api/v1
          BUDGETWISE_API_URL: https://legacy.onrender.com/api/v1
        run: |
          cd frontend
          node build.js
          test -f dist/index.html
          test -f dist/dashboard.html
          test -f dist/js/ai-insights.js
          node --check dist/js/runtime-config.js
          grep -q 'https://example.onrender.com/api/v1' dist/js/runtime-config.js
          ! grep -q 'https://legacy.onrender.com/api/v1' dist/js/runtime-config.js
          if grep -q '127.0.0.1:8000' dist/js/runtime-config.js; then
            echo "Production runtime configuration incorrectly points at localhost"
            exit 1
          fi
      - name: Legacy BudgetWise build key stays functional
        env:
          BUDGETWISE_API_URL: https://legacy.onrender.com/api/v1
        run: |
          cd frontend
          node build.js
          grep -q 'https://legacy.onrender.com/api/v1' dist/js/runtime-config.js


  postgres-tests:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: testing
      BUDGETWISE_TEST_POSTGRES: '1'
      DATABASE_URL: postgresql://budgetwise:budgetwise_ci_only@127.0.0.1:5432/budgetwise_test
      DATABASE_NAME: do_not_use_this_sqlite_file.db
      SECRET_KEY: postgres-test-key-for-ci-only-not-for-production-2026
      ALGORITHM: HS256
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: budgetwise
          POSTGRES_PASSWORD: budgetwise_ci_only
          POSTGRES_DB: budgetwise_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U budgetwise -d budgetwise_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Run real PostgreSQL integration and data migration tests
        run: python -m pytest tests/test_postgres_integration.py -q

  browser-e2e:
    name: Browser acceptance — isolated SQLite
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: testing
      DATABASE_NAME: ci_browser_fundhaven.sqlite3
      SECRET_KEY: browser-ci-only-fundhaven-test-key-2026
      ALGORITHM: HS256
    steps:
      - uses: actions/checkout@v4
      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install app and Playwright Chromium
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Start isolated local application
        run: |
          set -eu
          test -z "${DATABASE_URL:-}"
          python -m uvicorn api:app --host 127.0.0.1 --port 8000 > /tmp/fundhaven-e2e-backend.log 2>&1 &
          python -m http.server 5500 --bind 127.0.0.1 --directory frontend > /tmp/fundhaven-e2e-frontend.log 2>&1 &
          for attempt in $(seq 1 45); do
            if curl --silent --fail http://127.0.0.1:8000/ready >/dev/null &&
               curl --silent --fail http://127.0.0.1:5500/login.html >/dev/null; then
              echo "Local QA servers ready"
              exit 0
            fi
            sleep 2
          done
          echo "Local QA servers not ready"
          exit 1
      - name: Run real-browser financial workflow
        run: python -m pytest -q browser_tests/test_user_journey.py
      - name: Upload isolated test screenshot if workflow fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fundhaven-local-browser-error
          path: browser_tests/artifacts/
          if-no-files-found: ignore
          retention-days: 3
