# Render Free: FundHaven FastAPI backend (frontend deploys on Netlify or Vercel).
# Provision through https://dashboard.render.com/blueprints.
# No SQLite: DATABASE_URL must point at your existing Supabase PostgreSQL DB.
# Secrets MUST be provided privately in Render; never add credentials here.

services:
  - type: web
    name: budgetwise-api
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false

# After deploying the frontend on Netlify (or Vercel), set in
# Render service → Environment, then redeploy:
# FUNDHAVEN_ALLOWED_ORIGINS=https://YOUR-EXACT-APP.netlify.app
# Keep BUDGETWISE_ALLOWED_ORIGINS temporarily if already in use.
# The existing Render service name is a hosting identifier, not app branding.
#
# Sign-in uses email/username and password with JWT; no Brevo OTP required.
# Brevo may still be configured separately for optional notifications.
# OPENAI_API_KEY is optional for model-generated advice.
