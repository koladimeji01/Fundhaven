<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | BudgetWise</title>

    <link rel="stylesheet" href="css/dashboard.css">
    <!-- BudgetWise API endpoint: local by default, configured at deploy time -->
    <script src="js/runtime-config.js"></script>
</head>

<body class="auth-page">

    <div class="auth-container">

        <div class="auth-card">

            <div class="auth-logo">
                <div class="logo-mark">₦</div>

                <div>
                    <h1>BudgetWise</h1>
                    <p>Personal Finance Assistant</p>
                </div>
            </div>

            <div class="auth-heading">
                <h2>Create your account</h2>
                <p>Start taking control of your finances today.</p>
            </div>

            <form id="registerForm">

                <div class="form-group">
                    <label for="name">Full Name</label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        minlength="2"
                        maxlength="50"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="income">Monthly Income</label>

                    <div class="input-with-prefix">
                        <span>₦</span>

                        <input
                            type="number"
                            id="income"
                            name="income"
                            placeholder="300000"
                            min="0.01"
                            step="0.01"
                            required
                        >
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Minimum 8 characters"
                        minlength="8"
                        maxlength="100"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>

                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Re-enter your password"
                        minlength="8"
                        maxlength="100"
                        required
                    >
                </div>

                <div id="registerError" class="auth-message error"></div>

                <div id="registerSuccess" class="auth-message success"></div>

                <button type="submit" class="auth-button" id="registerButton">
                    Create Account
                </button>

            </form>

            <div class="auth-footer">
                <p>
                    Already have an account?
                    <a href="login.html">Sign in</a>
                </p>
            </div>

        </div>

    </div>

    <script src="js/register.js"></script>

</body>
</html>
