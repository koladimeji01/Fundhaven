<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign In | FundHaven</title>

    <link rel="stylesheet" href="css/dashboard.css">
    <!-- FundHaven API endpoint: local by default, configured at deploy time -->
    <script src="js/runtime-config.js"></script>
    <link rel="icon" type="image/svg+xml" href="assets/fundhaven-mark.svg">
    <link rel="stylesheet" href="css/brand.css">
</head>

<body class="auth-page">

    <div class="auth-container">

        <div class="auth-card">

            <!-- Logo -->
            <div class="auth-logo">

                <div class="logo-mark"><img src="assets/fundhaven-mark.svg" alt="" aria-hidden="true"></div>

                <div>
                    <h1>FundHaven</h1>
                    <p>Expense tracking, made simple</p>
                </div>

            </div>


            <!-- Heading -->
            <div class="auth-heading">

                <h2>Welcome back</h2>

                <p>
                    Sign in to continue managing your finances.
                </p>

            </div>


            <!-- Login Form -->
            <form id="loginForm">

                <div class="form-group">

                    <label for="email">
                        Email address or username
                    </label>

                    <input
                        type="text"
                        id="email"
                        name="email"
                        placeholder="Email address or username"
                        autocomplete="username"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <!-- Error message -->
                <div
                    id="loginError"
                    class="auth-message error"
                ></div>


                <!-- Sign in button -->
                <button
                    type="submit"
                    class="auth-button"
                    id="loginButton"
                >
                    Sign In
                </button>

            </form>


            <!-- Register -->
            <div class="auth-footer">

                <p>
                    Don't have an account?
                    <a href="register.html">
                        Create an account
                    </a>
                </p>

            </div>

        </div>

    </div>


    <!-- IMPORTANT: JavaScript must be loaded -->
    <!-- Login --><!-- Authentication -->

        <!-- Dashboard -->
    <script src="js/login.js"></script>
</body>
</html>
