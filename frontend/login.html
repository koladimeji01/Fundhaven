<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign In | BudgetWise</title>

    <link rel="stylesheet" href="css/dashboard.css">
    <!-- BudgetWise API endpoint: local by default, configured at deploy time -->
    <script src="js/runtime-config.js"></script>
</head>

<body class="auth-page">

    <div class="auth-container">

        <div class="auth-card">

            <!-- Logo -->
            <div class="auth-logo">

                <div class="logo-mark">
                    ₦
                </div>

                <div>
                    <h1>BudgetWise</h1>
                    <p>Personal Finance Assistant</p>
                </div>

            </div>


            <!-- Heading -->
            <div class="auth-heading">

                <h2>Welcome back</h2>

                <p>
                    Sign in to continue managing your finances.
                </p>

            </div>


            <!-- Login Form -->
            <form id="loginForm">

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        autocomplete="email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <!-- Error message -->
                <div
                    id="loginError"
                    class="auth-message error"
                ></div>


                <!-- Sign in button -->
                <button
                    type="submit"
                    class="auth-button"
                    id="loginButton"
                >
                    Sign In
                </button>

            </form>


            <!-- Sign-in verification, shown only after password is checked -->
            <form id="verificationForm" style="display:none" autocomplete="off">
                <div class="auth-heading">
                    <h2>Verify your sign-in</h2>
                    <p id="otpMessage">
                        Enter the six-digit code we sent to your email.
                        It expires in five minutes.
                    </p>
                </div>

                <div class="form-group">
                    <label for="verificationCode">Email verification code</label>
                    <input
                        type="text"
                        id="verificationCode"
                        name="verification_code"
                        inputmode="numeric"
                        autocomplete="one-time-code"
                        placeholder="000000"
                        pattern="[0-9]{6}"
                        maxlength="6"
                        minlength="6"
                        aria-describedby="otpMessage"
                        required
                    >
                </div>

                <div id="otpError" class="auth-message error"
                     role="alert" style="display:none"></div>

                <button type="submit" class="auth-button" id="verifyButton">
                    Verify &amp; Sign In
                </button>

                <div style="display:flex;gap:15px;flex-wrap:wrap;justify-content:space-between;margin-top:17px">
                    <button id="resendCodeButton" type="button"
                            style="background:none;border:none;color:#246148;font-weight:700;cursor:pointer;padding:5px 0">
                        Resend code
                    </button>
                    <button id="backToSignIn" type="button"
                            style="background:none;border:none;color:#596e60;cursor:pointer;padding:5px 0">
                        Back to sign in
                    </button>
                </div>
            </form>

            <!-- Register -->
            <div class="auth-footer">

                <p>
                    Don't have an account?
                    <a href="register.html">
                        Create an account
                    </a>
                </p>

            </div>

        </div>

    </div>


    <!-- IMPORTANT: JavaScript must be loaded -->
    <!-- Login --><!-- Authentication -->

        <!-- Dashboard -->
    <script src="js/login.js"></script>
</body>
</html>
